<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreadHouse - Оформлення замовлення</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/forms.css">
</head>
<body>

    <header class="header">
        <div class="logo">BreadHouse</div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="./index.html">Головна</a></li>
                <li><a href="./index.html">Каталог</a></li>
                <li><a href="./checkout.html">Оформлення замовлення</a></li>
                <li><a href="#">Про нас</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="checkout.html" class="btn btn-cart" style="text-decoration: none; display: inline-block;">Кошик (0)</a>
        </div>
    </header>

    <main class="page-layout-form">
        <h2>Оформлення замовлення</h2>
        
        <form action="#" method="POST" class="checkout-form">
            
            <fieldset>
                <legend>1. Особисті дані</legend>
                <div class="form-group">
                    <label for="fullName">ПІБ:</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                        placeholder="Іванов Іван Іванович"
                    />
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com" />
                </div>
                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        pattern="[\+]\d{2}\d{10}"
                        placeholder="+380991234567"
                        required
                        title="Формат: +380XXXXXXXXX"
                    />
                </div>
            </fieldset>

            <fieldset>
                <legend>2. Спосіб доставки</legend>
                <div class="form-radio">
                    <input
                        type="radio"
                        id="deliveryNova"
                        name="delivery"
                        value="nova_poshta"
                        checked
                    />
                    <label for="deliveryNova">Нова Пошта</label>
                </div>
                <div class="form-radio">
                    <input
                        type="radio"
                        id="deliveryCourier"
                        name="delivery"
                        value="courier"
                    />
                    <label for="deliveryCourier">Кур'єр за адресою</label>
                </div>

                <div class="form-group style-select">
                    <label for="city">Місто:</label>
                    <select id="city" name="city">
                        <option value="kyiv">Київ</option>
                        <option value="lviv">Львів</option>
                        <option value="odesa">Одеса</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>3. Додатково</legend>
                <div class="form-group">
                    <label for="comments">Коментар до замовлення:</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Ваші побажання до замовлення..."></textarea>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="agree" required />
                    <label for="agree">Я погоджуюсь з правилами магазину</label>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Підтвердити замовлення</button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 BreadHouse — Пекарня свіжої випічки</p>
    </footer>

</body>
</html>
